<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Yang_bone | 我的文档站</title>
        <link rel="icon" href="https://raw.githubusercontent.com/Yang-bone/yang-bone.github.io/refs/heads/main/tou.png" type="image/png">
        <link rel="stylesheet" href="./assets/style.DN9XD1Jq.css">
        <style>
            ::backdrop {
                background-color: rgba(100, 100, 100, 0.8);
            }
            body {
                min-height: 100vh;
                margin: 0;
                color: #f4f1f8;
                background: #17171d url('./background.png') center / cover fixed;
                font-family: system-ui, sans-serif;
            }
            main {
                width: min(720px, calc(100% - 40px));
                margin: 0 auto;
                padding: 48px 0;
            }
            .identity {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 48px;
            }
            .avatar {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                object-fit: cover;
            }
            .identity strong {
                font-size: 18px;
            }
            .github-link {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-left: auto;
                color: inherit;
                text-decoration: none;
            }
            .github-link img {
                width: 24px;
                height: 24px;
                filter: invert(1);
            }
            h1 {
                color: #3E2962;
                font-size: 32px;
                text-shadow: 0 0 60px #3E2962;
                font-family: 'Adofai2', sans-serif;
            }
            p {
                color: #3E2962;
                font-family: 'Adofai', sans-serif;
            }
            .back-link {
                color: #ffb454;
            }
            #fireworks {
                position: fixed;
                inset: 0;
                z-index: 9999;
                width: 100%;
                height: 100%;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <main>
            <header class="identity">
                <img class="avatar" src="https://raw.githubusercontent.com/Yang-bone/yang-bone.github.io/refs/heads/main/tou.png" alt="Yang_bone 头像">
                <strong>Yang_bone</strong>
                <a class="github-link" href="https://github.com/Yang-bone" target="_blank" rel="noopener noreferrer">
                    <img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='24' height='24'%3E%3Cpath fill='black' d='M12 .297c-6.63 0-12 5.373-12 12c0 5.303 3.438 9.8 8.205 11.385c.6.113.82-.258.82-.577c0-.285-.01-1.04-.015-2.04c-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729c1.205.084 1.838 1.236 1.838 1.236c1.07 1.835 2.809 1.305 3.495.998c.108-.776.417-1.305.76-1.605c-2.665-.3-5.466-1.332-5.466-5.93c0-1.31.465-2.38 1.235-3.22c-.135-.303-.54-1.523.105-3.176c0 0 1.005-.322 3.3 1.23c.96-.267 1.98-.399 3-.405c1.02.006 2.04.138 3 .405c2.28-1.552 3.285-1.23 3.285-1.23c.645 1.653.24 2.873.12 3.176c.765.84 1.23 1.91 1.23 3.22c0 4.61-2.805 5.625-5.475 5.92c.42.36.81 1.096.81 2.22c0 1.606-.015 2.896-.015 3.286c0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12'/%3E%3C/svg%3E">
                    GitHub
                </a>
            </header>
            <a class="back-link" href="https://yang-bone.github.io/new">返回</a>
        </main>
        <canvas id="fireworks" aria-hidden="true"></canvas>
        <script>
            const canvas = document.getElementById('fireworks');
            const context = canvas.getContext('2d');
            const particles = [];
            const colors = ['#ff5d8f', '#ffc857', '#70e1c1', '#8bb8ff', '#d39bff'];
            let animationFrame = 0;

            function resizeCanvas() {
                const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.round(window.innerWidth * pixelRatio);
                canvas.height = Math.round(window.innerHeight * pixelRatio);
                context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
            }

            function burst(x, y) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const count = 56;

                for (let index = 0; index < count; index += 1) {
                    const angle = (Math.PI * 2 * index) / count + Math.random() * 0.12;
                    const speed = 1.5 + Math.random() * 4.5;
                    particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        decay: 0.012 + Math.random() * 0.012,
                        size: 1.5 + Math.random() * 2.5,
                        color
                    });
                }

                if (!animationFrame) animationFrame = requestAnimationFrame(animate);
            }

            function animate() {
                context.clearRect(0, 0, window.innerWidth, window.innerHeight);

                for (let index = particles.length - 1; index >= 0; index -= 1) {
                    const particle = particles[index];
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += 0.035;
                    particle.vx *= 0.985;
                    particle.vy *= 0.985;
                    particle.life -= particle.decay;

                    if (particle.life <= 0) {
                        particles.splice(index, 1);
                        continue;
                    }

                    context.globalAlpha = particle.life;
                    context.fillStyle = particle.color;
                    context.beginPath();
                    context.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    context.fill();
                }

                context.globalAlpha = 1;
                animationFrame = particles.length ? requestAnimationFrame(animate) : 0;
            }

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('click', (event) => burst(event.clientX, event.clientY));
            resizeCanvas();
        </script>
    </body>
</html>
