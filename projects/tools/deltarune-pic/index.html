
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://raw.githubusercontent.com/Yang-bone/yang-bone.github.io/main/tou.png" type="image/png">
    <title>我的友情链接</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f1015;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .status-text {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 40px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 201, 255, 0.3);
            animation: titleFloat 3s ease-in-out infinite alternate;
        }

        @keyframes titleFloat {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .placeholder-img {
            max-width: 100%;
            width: 400px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            animation: fadeIn 1s ease forwards 0.5s;
        }

        .placeholder-img:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 50px rgba(0, 201, 255, 0.2);
        }

        .hint-text {
            margin-top: 30px;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeIn 1s ease forwards 1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="status-text">还没做，请等待！</h1>
        <img src="https://raw.githubusercontent.com/Yang-bone/yang-bone.github.io/refs/heads/main/projects/tools/deltarune-pic/%E6%AF%99%E6%8E%89%E4%BA%86_400x157.png" alt="即将上线" class="placeholder-img">
        <p class="hint-text">页面正在建设中，敬请期待~</p>
    </div>

</body>
</html>
