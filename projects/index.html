<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Yang_bone的项目</title>
        <script type="module" src="index.js"></script>
        <style>
            @font-face {
                font-family: 'Adofai 2';
                src: url('project/adofai 2.ttf') format('truetype');
            }
            html, body {
                width: 100%;
                min-height: 100%;
                margin: 0;
                padding: 0;
                background-color: #000;
            }
            body {
                background-image: url("https://api.yppp.net/api.php");
                background-size: cover;
                background-position: center center;
                background-repeat: no-repeat;
                background-attachment: fixed;
                min-height: 100vh;
                height: 100vh;
                font-family: 'Adofai 2', sans-serif;
                padding: 2rem;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                overflow-y: auto;
                overflow-x: hidden;
            }
            #returnLink {
                position: fixed;
                top: 1rem;
                left: 1rem;
                z-index: 20;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 0.55rem 0.9rem;
                border: 1px solid rgba(255, 255, 255, 0.4);
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.9);
                color: #111;
                text-decoration: none;
                box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
                font-family: 'Adofai 2', sans-serif;
                transition: transform 0.2s ease, background 0.2s ease;
            }
            #returnLink:hover {
                transform: translateY(-1px);
                background: rgba(255, 255, 255, 1);
            }
            .center-wrap {
                position: relative;
                width: 100%;
                max-width: 980px;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                margin-top: calc(50vh - 5rem);
            }
            h1 {
                display: inline-block;
                margin: 0;
                padding: 1rem 1.5rem;
                color: #000000;
                font-size: 3rem;
                font-family: 'Adofai 2', sans-serif;
                background: rgba(255, 255, 255, 0.18);
                border: 1px solid rgba(255, 255, 255, 0.4);
                border-radius: 28px;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
                text-align: center;
                white-space: nowrap;
                cursor: pointer;
                animation: floatIdle 4s ease-in-out infinite;
                transition: transform 0.6s ease, opacity 0.6s ease;
            }
            h1.title-exiting {
                animation: none;
                transform: translateY(-180%);
                opacity: 0;
            }
            #menu {
                position: fixed;
                top: 11rem;
                left: 50%;
                transform: translate(-50%, -20px);
                opacity: 0;
                visibility: hidden;
                width: min(calc(100% - 2rem), 1180px);
                max-width: 1180px;
                max-height: calc(100vh - 12rem);
                overflow-y: auto;
                padding: 1.5rem 1.25rem;
                background: rgba(255, 255, 255, 0.92);
                border: 1px solid rgba(0, 0, 0, 0.12);
                border-radius: 28px;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
                color: #111;
                z-index: 10;
                pointer-events: none;
                transition: opacity 0.45s ease, transform 0.45s ease;
            }
            #menu.show {
                opacity: 1;
                visibility: visible;
                transform: translate(-50%, 0);
                pointer-events: auto;
            }
            #menu.closing {
                opacity: 0;
                visibility: hidden;
                transform: translate(-50%, -20px);
                pointer-events: none;
            }
            .menu-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 1.25rem;
            }
            #menu h2 {
                margin: 0;
                font-size: 2rem;
                line-height: 1.2;
            }
            .menu-toggle {
                border: none;
                background: rgba(0, 0, 0, 0.08);
                color: #111;
                border-radius: 999px;
                padding: 0.5rem 0.9rem;
                cursor: pointer;
                font-size: 0.95rem;
            }
            .project-controls {
                display: flex;
                flex-wrap: wrap;
                gap: 0.9rem;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 1rem;
            }
            .project-search {
                flex: 1 1 240px;
                min-width: 220px;
                padding: 0.95rem 1rem;
                border: 1px solid rgba(0,0,0,0.12);
                border-radius: 999px;
                background: rgba(255,255,255,0.9);
                color: #111;
                outline: none;
                box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
            }
            .project-search::placeholder {
                color: rgba(0,0,0,0.4);
            }
            .project-filter-buttons {
                display: flex;
                flex-wrap: wrap;
                gap: 0.6rem;
                justify-content: flex-end;
            }
            .filter-button {
                border: none;
                padding: 0.7rem 1rem;
                border-radius: 999px;
                cursor: pointer;
                color: #fff;
                opacity: 0.85;
                transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
                background: #8b8b8b;
                min-width: 72px;
            }
            .filter-button.active,
            .filter-button:hover {
                opacity: 1;
                transform: translateY(-1px);
            }
            .filter-button[data-filter="AI项目"] { background: #8b5cf6; }
            .filter-button[data-filter="图片项目"] { background: #f59e0b; }
            .filter-button[data-filter="小游戏"] { background: #10b981; }
            .filter-button[data-filter="工具"] { background: #3b82f6; }
            .filter-button[data-filter="演示"] { background: #ef4444; }
            .filter-button[data-filter="all"] { background: #6b7280; }
            .project-grid {
                display: grid;
                gap: 1rem;
                grid-template-columns: repeat(4, minmax(220px, 1fr));
                justify-items: center;
                align-items: stretch;
            }
            @media (max-width: 1120px) {
                .project-grid {
                    grid-template-columns: repeat(3, minmax(220px, 1fr));
                }
            }
            @media (max-width: 860px) {
                .project-grid {
                    grid-template-columns: repeat(2, minmax(220px, 1fr));
                }
            }
            @media (max-width: 580px) {
                .project-grid {
                    grid-template-columns: 1fr;
                }
            }
            .project-card {
                background: rgba(255, 255, 255, 0.95);
                border: 1px solid rgba(0, 0, 0, 0.08);
                border-radius: 22px;
                overflow: hidden;
                box-shadow: 0 16px 30px rgba(0,0,0,0.12);
                backdrop-filter: blur(10px);
                transition: transform 0.3s ease, border-color 0.3s ease;
                cursor: pointer;
                display: flex;
                flex-direction: column;
                width: 100%;
                max-width: 280px;
                min-width: 0;
                text-decoration: none;
                color: inherit;
            }
            .project-card:hover {
                transform: translateY(-6px);
                border-color: rgba(0, 0, 0, 0.2);
            }
            .project-card img {
                width: 100%;
                height: 160px;
                object-fit: cover;
                display: block;
            }
            .project-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 0.45rem;
                margin-top: 1rem;
            }
            .project-card .project-body {
                padding: 1rem;
                text-align: left;
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .project-card h3 {
                margin: 0 0 0.5rem;
                font-size: 1.15rem;
            }
            .project-card p {
                margin: 0;
                color: rgba(0, 0, 0, 0.72);
                font-size: 0.95rem;
                line-height: 1.4;
            }
            .project-card .project-tag {
                margin-top: 1rem;
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
                padding: 0.4rem 0.75rem;
                border-radius: 999px;
                background: rgba(0,0,0,0.08);
                color: #111;
                font-size: 0.85rem;
                align-self: flex-start;
            }
            @keyframes floatIdle {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }
        </style>
    </head>
    <body>
        <div class="center-wrap">
            <a id="returnLink" href="https://yang-bone.github.io/new">返回</a>
            <h1 id="pageTitle">这里是Yang_bone的项目</h1>
            <div id="menu">
                <div class="menu-header">
                    <h2>我的项目</h2>
                    <button class="menu-toggle" type="button">收起</button>
                </div>
                <div class="project-controls">
                    <input id="projectSearch" class="project-search" type="search" placeholder="搜索项目名称..." aria-label="搜索项目名称">
                    <div class="project-filter-buttons">
                        <button class="filter-button active" data-filter="all">全部</button>
                        <button class="filter-button" data-filter="AI项目">AI项目</button>
                        <button class="filter-button" data-filter="图片项目">图片</button>
                        <button class="filter-button" data-filter="小游戏">小游戏</button>
                        <button class="filter-button" data-filter="工具">工具</button>
                        <button class="filter-button" data-filter="演示">演示</button>
                    </div>
                </div>
                <div class="project-grid">
                    <a class="project-card" href="https://yang-bone.github.io/projects/ai/milk-frog-water/" target="_blank" rel="noopener noreferrer">
                        <img src="https://github.com/Yang-bone/yang-bone.github.io/blob/main/projects/ai/milk-frog-water/bake.png?raw=true" alt="项目1">
                        <div class="project-body">
                            <div>
                                <h3>奶娃喝水</h3>
                                <p>一个简单的AI项目,使用了2天天家对话
                                    快去关注罗太永不破防,在B站搜索"罗太永不破防"就能找到他的主页,他是一个非常有趣的up主,我非常喜欢他的视频,所以我决定做一个AI项目来向他致敬
                                </p>
                            </div>
                            <div class="project-tags">
                                <span class="project-tag">AI项目</span>
                                <span class="project-tag">有趣</span>
                                <span class="project-tag">HTML5实现</span>
                            </div>
                        </div>
                    </a>
                    <a class="project-card" href="https://example.com/project2" target="_blank" rel="noopener noreferrer" data-title="项目 2" data-categories="小游戏,互动">
                        <img src="https://via.placeholder.com/420x240.png?text=项目+2" alt="项目2">
                        <div class="project-body">
                            <div>
                                <h3>项目 2</h3>
                                <p>无</p>
                            </div>
                            <div class="project-tags">
                                <span class="project-tag">小游戏</span>
                                <span class="project-tag">互动</span>
                            </div>
                        </div>
                    </a>
                    <a class="project-card" href="https://example.com/project3" target="_blank" rel="noopener noreferrer" data-title="项目 3" data-categories="工具,实用">
                        <img src="https://via.placeholder.com/420x240.png?text=项目+3" alt="项目3">
                        <div class="project-body">
                            <div>
                                <h3>项目 3</h3>
                                <p>无</p>
                            </div>
                            <div class="project-tags">
                                <span class="project-tag">工具</span>
                                <span class="project-tag">实用</span>
                            </div>
                        </div>
                    </a>
                    <a class="project-card" href="https://example.com/project4" target="_blank" rel="noopener noreferrer" data-title="项目 4" data-categories="演示,效果">
                        <img src="https://via.placeholder.com/420x240.png?text=项目+4" alt="项目4">
                        <div class="project-body">
                            <div>
                                <h3>项目 4</h3>
                                <p>无</p>
                            </div>
                            <div class="project-tags">
                                <span class="project-tag">演示</span>
                                <span class="project-tag">效果</span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
