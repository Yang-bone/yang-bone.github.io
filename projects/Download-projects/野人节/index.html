    <style>
        body{
            background-color: rgba(0, 0, 0, 0.9);
        }
        h1 {
            font-size: 2em;
            text-align: center;
            margin: 3% auto 0;
            background-color: rgba(255, 255, 255, 0.8);
            width: 20%;
            color: #000000;
            -webkit-backdrop-filter: blur(10px); /* Safari 9+, iOS 9+ */
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 10px solid transparent;
            background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)) padding-box,
                        linear-gradient(45deg, #8a2be2, #00ffff, #ff69b4) border-box;
            background-clip: padding-box, border-box;
        }
        button {
            display: block;
            margin: 2% auto;
            padding: 15px 30px;
            font-size: 1.5em;
            color: #fff;
            background-color: #007BFF;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        /* From Uiverse.io by satyamchaudharydev */ 
        .button {
        --width: 20%;
        --height: 60px;
        --tooltip-height: 35px;
        --tooltip-width: 90px;
        --gap-between-tooltip-to-button: 18px;
        --button-color: #1163ff;
        --tooltip-color: #fff;
        width: var(--width);
        height: var(--height);
        background: var(--button-color);
        position: relative;
        text-align: center;
        border-radius: 0.45em;
        font-family: "Arial";
        margin-left: 50%;
        margin-top: 50px;
        transform: translateX(-50%);
        transition: background 0.3s;
        }

        .button::before {
        position: absolute;
        content: attr(data-tooltip);
        width: var(--tooltip-width);
        height: var(--tooltip-height);
        background-color: var(--tooltip-color);
        font-size: 0.9rem;
        color: #111;
        border-radius: .25em;
        line-height: var(--tooltip-height);
        top: calc(var(--height) + var(--gap-between-tooltip-to-button) + 10px);
        left: calc(50% - var(--tooltip-width) / 2);
        }

        .button::after {
        position: absolute;
        content: '';
        width: 0;
        height: 0;
        border: 10px solid transparent;
        border-top-color: var(--tooltip-color);
        left: calc(50% - 10px);
        top: calc(100% + var(--gap-between-tooltip-to-button) - 10px);
        }

        .button::after,.button::before {
        opacity: 0;
        visibility: hidden;
        transition: all 0.5s;
        }

        .text {
        display: flex;
        align-items: center;
        justify-content: center;
        }

        .button-wrapper,.text,.icon {
        overflow: hidden;
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        color: #fff;
        }

        .text {
        top: 0
        }

        .text,.icon {
        transition: top 0.5s;
        }

        .icon {
        color: #fff;
        top: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        }

        .icon svg {
        width: 24px;
        height: 24px;
        }

        .button:hover {
        background: #6c18ff;
        }

        .button:hover .text {
        top: -100%;
        }

        .button:hover .icon {
        top: 0;
        }

        .button:hover:before,.button:hover:after {
        opacity: 1;
        visibility: visible;
        }

        .button:hover:after {
        top: calc(var(--height) + var(--gap-between-tooltip-to-button) - 20px);
        }

        .button:hover:before {
        top: calc(var(--height) + var(--gap-between-tooltip-to-button));
        }

    </style>
</head>
