</head>

                { word: '书本', hint: '里面有文字和图片', difficulty: 1 },

                { word: '爸爸', hint: '母亲的丈夫', difficulty: 1 },
                
                // 中级词汇（4-6关）- 2-4个字符
                { word: '计算机', hint: '可以用来上网、工作的电子设备', difficulty: 2 },
                { word: '电视机', hint: '可以看节目和电影的设备', difficulty: 2 },
                { word: '电话', hint: '用来远距离通话的设备', difficulty: 2 },
                { word: '手表', hint: '戴在手腕上看时间的物品', difficulty: 2 },
                { word: '眼镜', hint: '帮助视力不好的人看清东西', difficulty: 2 },

                { word: '公园', hint: '可以散步、玩耍的公共场所', difficulty: 2 },
                { word: '汽车', hint: '一种交通工具', difficulty: 2 },
                { word: '火车', hint: '在铁轨上行驶的交通工具', difficulty: 2 },
                { word: '飞机', hint: '在天上飞的交通工具', difficulty: 2 },
                { word: '音乐', hint: '好听的声音组合', difficulty: 2 },
                { word: '美术', hint: '画画、雕塑等艺术形式', difficulty: 2 },
                { word: '体育', hint: '锻炼身体的活动', difficulty: 2 },
                
                // 高级词汇（7-10关）- 3-5个字符
                { word: '互联网', hint: '连接全球电脑的网络', difficulty: 3 },
                { word: '人工智能', hint: '让机器像人一样思考的技术', difficulty: 3 },
                { word: '环境保护', hint: '保护自然环境的行为', difficulty: 3 },
                { word: '可持续发展', hint: '满足当前需求又不损害未来的发展', difficulty: 3 },
                { word: '全球化', hint: '世界各国相互联系的过程', difficulty: 3 },
                { word: '创新', hint: '创造新的事物或方法', difficulty: 3 },
                { word: '挑战', hint: '需要努力克服的困难', difficulty: 3 },
                { word: '机遇', hint: '有利的时机或机会', difficulty: 3 },
                { word: '未来', hint: '现在之后的时间', difficulty: 3 },
                { word: '探索', hint: '寻找未知事物的过程', difficulty: 3 },
                { word: '科学', hint: '研究自然和规律的知识', difficulty: 3 },

                { word: '传统', hint: '代代相传的习俗', difficulty: 3 },
                { word: '现代', hint: '当前的、最新的', difficulty: 3 }
            ],
            
            // 英语单词库按难度分级
            englishWords: [
                // 初级英语词汇（11-13关）
                { word: 'apple', hint: 'A red or green fruit', difficulty: 1 },
                { word: 'banana', hint: 'A long yellow fruit', difficulty: 1 },
                { word: 'orange', hint: 'A round citrus fruit', difficulty: 1 },
                { word: 'book', hint: 'Something you read', difficulty: 1 },
                { word: 'pen', hint: 'Used for writing', difficulty: 1 },
                { word: 'cat', hint: 'A small furry animal', difficulty: 1 },
                { word: 'dog', hint: 'A loyal pet', difficulty: 1 },
                { word: 'sun', hint: 'Gives light and heat', difficulty: 1 },
                { word: 'moon', hint: 'Shines at night', difficulty: 1 },
                { word: 'tree', hint: 'Has leaves and roots', difficulty: 1 },
                
                // 中级英语词汇（14-16关）
                { word: 'computer', hint: 'Used for work and internet', difficulty: 2 },
                { word: 'telephone', hint: 'Used to talk to people far away', difficulty: 2 },
                { word: 'hospital', hint: 'Where you go when sick', difficulty: 2 },
                { word: 'school', hint: 'Where you learn', difficulty: 2 },
                { word: 'teacher', hint: 'Helps students learn', difficulty: 2 },
                { word: 'student', hint: 'Person who learns', difficulty: 2 },
                { word: 'family', hint: 'Group of related people', difficulty: 2 },
                { word: 'friend', hint: 'Someone you like to be with', difficulty: 2 },
                { word: 'music', hint: 'Pleasant sounds', difficulty: 2 },
                { word: 'sports', hint: 'Physical activities', difficulty: 2 },
                
                // 高级英语词汇（17+关）
                { word: 'internet', hint: 'Global computer network', difficulty: 3 },
                { word: 'environment', hint: 'Natural world around us', difficulty: 3 },
                { word: 'technology', hint: 'Use of scientific knowledge', difficulty: 3 },
                { word: 'education', hint: 'Process of learning', difficulty: 3 },
                { word: 'innovation', hint: 'Creating something new', difficulty: 3 },
                { word: 'challenge', hint: 'Something difficult to do', difficulty: 3 },
                { word: 'opportunity', hint: 'A chance to do something', difficulty: 3 },
                { word: 'sustainability', hint: 'Ability to continue', difficulty: 3 },
                { word: 'communication', hint: 'Exchanging information', difficulty: 3 },
                { word: 'creativity', hint: 'Ability to create new things', difficulty: 3 }
            ]
        };

        // DOM 元素引用
        const elements = {
            scoreDisplay: document.getElementById('score'),
            levelDisplay: document.getElementById('level'),
            levelDetail: document.getElementById('level-detail'),
            difficultyDisplay: document.getElementById('difficulty'),
            languageDisplay: document.getElementById('language'),
            wordDisplay: document.getElementById('word-display'),
            wordHint: document.getElementById('word-hint'),
            inputContainer: document.getElementById('input-container'),
            submitBtn: document.getElementById('submit-btn'),
            restartBtn: document.getElementById('restart-btn'),
            hintBtn: document.getElementById('hint-btn'),
            levelSelectBtn: document.getElementById('level-select-btn'),
            levelSelectOverlay: document.getElementById('level-select-overlay'),
            levelSelectPanel: document.getElementById('level-select-panel'),
            closeLevelSelect: document.getElementById('close-level-select'),
            closeBtnTop: document.getElementById('close-btn-top'),
            levelGrid: document.getElementById('level-grid'),
            message: document.getElementById('message'),
            wordCard: document.getElementById('word-card')
        };

        // 初始化游戏
        function initGame() {
            gameState.score = 0;
            gameState.level = 1;
            gameState.levelProgress = 1;
            gameState.hintsUsed = 0;
            gameState.language = 'chinese';
            gameState.difficulty = 1;
            gameState.shownEnglishHint = false;
            updateScoreLevelDifficultyAndLanguage();
            loadNewWord();
            setupEventListeners();
            generateLevelButtons();
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 防止重复添加事件监听器
            elements.submitBtn.removeEventListener('click', checkAnswer);
            elements.restartBtn.removeEventListener('click', restartGame);
            elements.hintBtn.removeEventListener('click', showHint);
            elements.levelSelectBtn.removeEventListener('click', openLevelSelection);
            elements.closeLevelSelect.removeEventListener('click', closeLevelSelection);
            elements.closeBtnTop.removeEventListener('click', closeLevelSelection);
            document.removeEventListener('keydown', handleKeyPress);
            
            elements.submitBtn.addEventListener('click', checkAnswer);
            elements.restartBtn.addEventListener('click', restartGame);
            elements.hintBtn.addEventListener('click', showHint);
            elements.levelSelectBtn.addEventListener('click', openLevelSelection);
            elements.closeLevelSelect.addEventListener('click', closeLevelSelection);
            elements.closeBtnTop.addEventListener('click', closeLevelSelection);
            
            // 允许使用回车键提交答案
            document.addEventListener('keydown', handleKeyPress);
        }
        
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        }

        // 加载新单词
        function loadNewWord() {
            // 第10关后切换到英语
            if (gameState.level > 10) {
                gameState.language = 'english';
            } else {
                gameState.language = 'chinese';
            }
            
            // 获取当前语言的单词库
            const wordList = gameState.language === 'chinese' 
                ? gameState.chineseWords 
                : gameState.englishWords;
                
            // 更新语言显示
            elements.languageDisplay.textContent = gameState.language === 'chinese' ? '中文' : '英文';
            
            // 根据当前关卡选择合适难度的单词
            if (gameState.language === 'chinese') {
                gameState.difficulty = Math.min(Math.ceil(gameState.level / 3), 3);
            } else {
                // 英语关卡难度计算（11关对应英语难度1）
                gameState.difficulty = Math.min(Math.ceil((gameState.level - 10) / 3), 3);
            }
            
            const possibleWords = wordList.filter(
                item => item.difficulty === gameState.difficulty
            );
            
            // 随机选择一个单词
            const randomIndex = Math.floor(Math.random() * possibleWords.length);
            gameState.currentWord = possibleWords[randomIndex].word;
            gameState.currentHint = possibleWords[randomIndex].hint;
            
            // 显示单词提示
            elements.wordHint.textContent = `提示: ${gameState.currentHint}`;
            
            // 确定要隐藏的字符数量（1-2个，根据单词长度）
            const hiddenCount = gameState.currentWord.length > 2 ? 
                Math.floor(Math.random() * 2) + 1 : 1;
            
            // 选择要隐藏的字符索引
            gameState.hiddenIndices = [];
            while (gameState.hiddenIndices.length < hiddenCount) {
                const index = Math.floor(Math.random() * gameState.currentWord.length);
                if (!gameState.hiddenIndices.includes(index)) {
                    gameState.hiddenIndices.push(index);
                }
            }
            gameState.hiddenIndices.sort((a, b) => a - b);
            
            // 显示单词和输入框
            displayWord();
            createInputFields();
            
            // 清除消息
            showMessage('', '');
            
            // 当达到第5关且未显示过提示时，显示英语关卡提示
            if (gameState.level >= 5 && !gameState.shownEnglishHint) {
                showMessage('提示：第10关后将解锁英语单词消除关卡！', 'text-primary');
                gameState.shownEnglishHint = true;
            }
        }

        // 显示单词（带隐藏字符）
        function displayWord() {
            elements.wordDisplay.innerHTML = '';
            
            for (let i = 0; i < gameState.currentWord.length; i++) {
                const charDiv = document.createElement('div');
                charDiv.className = 'char-display';
                
                if (gameState.hiddenIndices.includes(i)) {
                    charDiv.innerHTML = '<span class="text-neutral">_</span>';
                } else {
                    charDiv.textContent = gameState.currentWord[i];
                }
                
                elements.wordDisplay.appendChild(charDiv);
            }
        }

        // 创建输入框
        function createInputFields() {
            elements.inputContainer.innerHTML = '';
            
            gameState.hiddenIndices.forEach((index, i) => {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'input-char';
                input.dataset.index = index;
                input.placeholder = '_';
                
                // 自动聚焦第一个输入框
                if (i === 0) {
                    setTimeout(() => input.focus(), 100);
                }
                
                // 输入后自动跳到下一个输入框
                input.addEventListener('input', (e) => {
                    if (e.target.value && i < gameState.hiddenIndices.length - 1) {
                        const nextInput = elements.inputContainer.children[i + 1];
                        nextInput.focus();
                    }
                });
                
                elements.inputContainer.appendChild(input);
            });
        }

        // 检查答案
        function checkAnswer() {
            const inputs = elements.inputContainer.querySelectorAll('input');
            let isCorrect = true;
            
            // 检查每个输入是否正确（英语不区分大小写）
            inputs.forEach(input => {
                const index = parseInt(input.dataset.index);
                let userChar = input.value.trim();
                
                // 英语单词不区分大小写检查
                if (gameState.language === 'english') {
                    userChar = userChar.toLowerCase();
                }
                
                if (!userChar || userChar !== gameState.currentWord[index]) {
                    isCorrect = false;
                    input.classList.add('border-danger');
                    // 错误动画
                    input.classList.add('animate-shake');
                    setTimeout(() => {
                        input.classList.remove('animate-shake');
                    }, 500);
                } else {
                    input.classList.add('border-secondary');
                }
            });
            
            // 处理结果
            if (isCorrect) {
                const langText = gameState.language === 'chinese' ? '中文' : '英文';
                showMessage(`正确！太棒了！(${langText})`, 'text-secondary');
                gameState.score += 10 * gameState.level;
                
                // 更新当前关卡进度
                gameState.levelProgress++;
                
                // 检查是否完成当前关卡
                if (gameState.levelProgress > gameState.levelTotal) {
                    gameState.level++;
                    gameState.levelProgress = 1;
                    
                    // 第10关升级到11关时的特殊提示
                    if (gameState.level === 11) {
                        showMessage(`恭喜！已解锁英语单词关卡！`, 'text-primary');
                    } else {
                        showMessage(`恭喜！升级到第${gameState.level}关！`, 'text-primary');
                    }
                }
                
                updateScoreLevelDifficultyAndLanguage();
                
                // 单词消除动画
                elements.wordCard.classList.add('scale-90', 'opacity-0', 'rotate-1');
                
                // 停留1秒再加载下一题
                setTimeout(() => {
                    elements.wordCard.classList.remove('scale-90', 'opacity-0', 'rotate-1', 'rotate--1');
                    loadNewWord();
                }, 1000);
            } else {
                // 只在答错时显示提示信息
                showMessage('有点小错误，再试一次！', 'text-danger');
                // 扣少量分数
                if (gameState.score > 0) {
                    gameState.score = Math.max(0, gameState.score - 2);
                    updateScoreLevelDifficultyAndLanguage();
                }
            }
        }

        // 显示提示
        function showHint() {
            if (gameState.score < 5) {
                showMessage('分数不足，无法使用提示！', 'text-danger');
                return;
            }
            
            // 消耗分数
            gameState.score -= 5;
            updateScoreLevelDifficultyAndLanguage();
            
            // 随机选择一个未填的输入框显示提示
            const inputs = elements.inputContainer.querySelectorAll('input');
            let emptyInputs = Array.from(inputs).filter(input => !input.value);
            
            if (emptyInputs.length === 0) {
                emptyInputs = Array.from(inputs);
            }
            
            const randomInput = emptyInputs[Math.floor(Math.random() * emptyInputs.length)];
            const index = parseInt(randomInput.dataset.index);
            
            // 提示动画
            randomInput.classList.add('bg-amber-100');
            setTimeout(() => {
                randomInput.value = gameState.currentWord[index];
                randomInput.classList.remove('bg-amber-100');
                showMessage('提示：已填充一个字符！', 'text-amber-500');
            }, 500);
            
            gameState.hintsUsed++;
        }

        // 显示消息
        function showMessage(text, className) {
            elements.message.textContent = text;
            elements.message.className = `text-center text-lg font-medium mb-4 transition-all duration-300 ${className}`;
            elements.message.style.opacity = '1';
            elements.message.style.transform = 'translateY(0)';
            
            // 3秒后隐藏消息
            setTimeout(() => {
                elements.message.style.opacity = '0';
                elements.message.style.transform = 'translateY(2px)';
            }, 3000);
        }

        // 更新分数、等级、难度和语言显示
        function updateScoreLevelDifficultyAndLanguage() {
            elements.scoreDisplay.textContent = gameState.score;
            elements.levelDisplay.textContent = gameState.level;
            elements.levelDetail.textContent = `${gameState.level}-${gameState.levelProgress}`; // 显示关卡细分
            elements.languageDisplay.textContent = gameState.language === 'chinese' ? '中文' : '英文';
            
            // 根据难度值显示对应的文本
            const difficultyText = gameState.difficulty === 1 ? '简单' : 
                                 gameState.difficulty === 2 ? '中等' : '困难';
            elements.difficultyDisplay.textContent = difficultyText;
            
            // 添加分数变化动画
            elements.scoreDisplay.classList.add('scale-125', 'text-secondary');
            setTimeout(() => {
                elements.scoreDisplay.classList.remove('scale-125', 'text-secondary');
            }, 300);
        }

        // 重新开始游戏
        function restartGame() {
            // 添加重置动画
            elements.wordCard.classList.add('scale-90', 'opacity-0', 'rotate--1');
            
            setTimeout(() => {
                initGame();
                elements.wordCard.classList.remove('scale-90', 'opacity-0', 'rotate-1', 'rotate--1');
                showMessage('游戏重新开始！', 'text-primary');
            }, 300);
        }

        // 生成选关按钮
        function generateLevelButtons() {
            elements.levelGrid.innerHTML = '';
            
            // 生成20个关卡按钮
            for (let i = 1; i <= 20; i++) {
                const levelBtn = document.createElement('div');
                levelBtn.className = 'level-btn';
                levelBtn.textContent = i;
                levelBtn.dataset.level = i;
                
                // 当前关卡高亮显示
                if (i === gameState.level) {
                    levelBtn.classList.add('bg-secondary');
                }
                
                // 英语关卡标记
                if (i > 10) {
                    const badge = document.createElement('span');
                    badge.className = 'absolute text-xs bg-white text-purple-500 rounded-full w-4 h-4 flex items-center justify-center -top-1 -right-1';
                    badge.textContent = 'E';
                    levelBtn.style.position = 'relative';
                    levelBtn.appendChild(badge);
                }
                
                levelBtn.addEventListener('click', () => selectLevel(i));
                elements.levelGrid.appendChild(levelBtn);
            }
        }

        // 打开选关界面
        function openLevelSelection() {
            // 更新关卡按钮状态
            generateLevelButtons();
            
            // 应用曲线动画（从左侧滑入）
            elements.levelSelectOverlay.style.transform = 'translateX(0)';
            elements.levelSelectOverlay.style.animation = 'slideInLeft 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
            
            // 稍微延迟面板动画，营造层次感
            setTimeout(() => {
                elements.levelSelectPanel.style.transform = 'translateX(0)';
                elements.levelSelectPanel.style.animation = 'slideInLeft 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.1s';
            }, 100);
        }

        // 关闭选关界面
        function closeLevelSelection() {
            // 应用曲线动画（滑出到左侧）
            elements.levelSelectPanel.style.transform = 'translateX(-100%)';
            elements.levelSelectPanel.style.animation = 'slideOutLeft 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
            
            setTimeout(() => {
                elements.levelSelectOverlay.style.transform = 'translateX(-100%)';
                elements.levelSelectOverlay.style.animation = 'slideOutLeft 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.1s';
            }, 100);
        }

        // 选择关卡
        function selectLevel(level) {
            gameState.level = level;
            gameState.levelProgress = 1;
            
            // 重置分数
            gameState.score = 0;
            
            // 更新显示
            updateScoreLevelDifficultyAndLanguage();
            
            // 关闭选关界面
            closeLevelSelection();
            
            // 加载新单词
            setTimeout(() => {
                loadNewWord();
                showMessage(`已切换到第${level}关`, 'text-primary');
            }, 800); // 等待动画完成
        }

        // 添加自定义动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                50% { transform: translateX(5px); }
                75% { transform: translateX(-5px); }
            }
            
            @keyframes slideInLeft {
                0% { 
                    transform: translateX(-100%) rotate(0deg);
                    opacity: 0;
                }
                50% {
                    transform: translateX(20%) rotate(2deg);
                    opacity: 0.8;
                }
                100% { 
                    transform: translateX(0) rotate(0deg);
                    opacity: 1;
                }
            }
            
            @keyframes slideOutLeft {
                0% { 
                    transform: translateX(0) rotate(0deg);
                    opacity: 1;
                }
                50% {
                    transform: translateX(-20%) rotate(-2deg);
                    opacity: 0.8;
                }
                100% { 
                    transform: translateX(-100%) rotate(0deg);
                    opacity: 0;
                }
            }
            
            .animate-shake {
                animation: shake 0.5s ease-in-out;
            }
            
            .rotate-1 {
                transform: rotate(1deg);
            }
            
            .rotate--1 {
                transform: rotate(-1deg);
            }
        `;
        document.head.appendChild(style);

        // 启动游戏
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
