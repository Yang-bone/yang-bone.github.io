<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action=manipulation">
  <title>🐋 虎鲸 · 赛博空间</title>
  <style>
    :root {
      --bg: #050814;
      --panel-bg: rgba(20, 30, 50, 0.85);
      --panel-border: rgba(0, 229, 255, 0.4);
      --text-main: #e0f7fa;
      --text-sub: #80deea;
      --accent-fish: #00e5ff;
      --accent-krill: #ff00ff;
      --shadow: 0 2px 16px rgba(0, 229, 255, 0.2);
      --shadow-lg: 0 6px 28px rgba(0, 229, 255, 0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0; overflow: hidden;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #canvas-container { position: fixed; inset: 0; z-index: 1; }
    #flash {
      position: fixed; inset: 0; z-index: 10;
      background: white; opacity: 0; pointer-events: none;
      transition: opacity 0.08s ease-out;
    }
    #flash.active { opacity: 0.7; transition: opacity 0.04s ease-in; }

    .thought-bubble {
      position: fixed; z-index: 30;
      background: rgba(10, 20, 40, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 15px;
      color: #00e5ff;
      font-weight: 500;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      border: 1.5px solid rgba(0, 229, 255, 0.6);
      pointer-events: none;
      animation: thoughtPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 thoughtFade 1.2s 0.6s ease-out forwards;
      white-space: nowrap;
    }
    .thought-bubble::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 12px solid rgba(0, 229, 255, 0.6);
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
    }
    @keyframes thoughtPop {
      0% { transform: scale(0) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @keyframes thoughtFade {
      0% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px); }
    }

    #top-bar {
      position: fixed; top: 16px; left: 16px; right: 16px;
      z-index: 20; display: flex; justify-content: space-between;
      align-items: flex-start; gap: 10px; pointer-events: none;
      flex-wrap: wrap;
    }
    #top-bar>* { pointer-events: auto; }
    #title-tag {
      background: var(--panel-bg); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--panel-border); border-radius: 28px;
      padding: 10px 20px; color: var(--text-main); font-weight: 600;
      font-size: 15px; letter-spacing: 0.5px; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .feed-panel {
      background: var(--panel-bg); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--panel-border); border-radius: 28px;
      padding: 10px 18px; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: all 0.25s ease; position: relative;
    }
    .feed-panel:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); border-color: #00e5ff; }
    .feed-panel:active { transform: scale(0.94); transition: transform 0.1s ease; }
    .feed-panel.cooldown { opacity: 0.55; pointer-events: none; }
    .feed-emoji { font-size: 26px; line-height: 1; animation: bob 2.2s ease-in-out infinite; }
    @keyframes bob {
      0%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } 60% { transform: translateY(-1px); }
    }
    .feed-count { font-weight: 700; font-size: 18px; color: var(--text-main); min-width: 22px; text-align: center; }
    .feed-label { font-size: 12px; color: var(--text-sub); letter-spacing: 0.4px; }
    .regen-bar {
      position: absolute; bottom: -3px; left: 18px; right: 18px;
      height: 3px; border-radius: 2px; background: rgba(255,255,255,0.1); overflow: hidden;
    }
    .regen-fill { height: 100%; border-radius: 2px; width: 0%; transition: width 0.3s linear; background: #00e5ff; }

    .music-toggle {
      background: var(--panel-bg); backdrop-filter: blur(14px);
      border: 1.5px solid var(--panel-border); border-radius: 28px;
      padding: 10px 16px; font-size: 18px; cursor: pointer;
      box-shadow: var(--shadow); transition: all 0.2s;
      line-height: 1; margin-left: 8px; color: white;
    }
    .music-toggle:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
    .music-toggle.muted { opacity: 0.6; }

    .flying-food {
      position: fixed; z-index: 25; font-size: 24px;
      pointer-events: none; transition: none;
      filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.8));
    }

    #gallery-bar {
      position: fixed; bottom: 16px; left: 16px; right: 16px;
      z-index: 20; display: flex; align-items: center; gap: 10px; pointer-events: none;
    }
    #gallery-label {
      background: var(--panel-bg); backdrop-filter: blur(14px);
      border: 1.5px solid var(--panel-border); border-radius: 22px;
      padding: 8px 14px; font-size: 12px; color: var(--text-sub);
      letter-spacing: 0.5px; box-shadow: var(--shadow);
      white-space: nowrap; flex-shrink: 0; pointer-events: auto;
    }
    #gallery-scroll {
      display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
      scroll-behavior: smooth; padding: 6px 4px; flex-grow: 1;
      pointer-events: auto; -webkit-overflow-scrolling: touch;
    }
    #gallery-scroll::-webkit-scrollbar { height: 4px; }
    #gallery-scroll::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.4); border-radius: 4px; }
    .photo-thumb {
      flex-shrink: 0; width: 62px; height: 72px; border-radius: 8px;
      background: #1a2a3a; box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
      cursor: pointer; transition: all 0.2s ease; position: relative;
      overflow: hidden; border: 2px solid rgba(0, 229, 255, 0.4);
    }
    .photo-thumb:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 0 18px rgba(0, 229, 255, 0.6); border-color: var(--accent-fish); }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .new-dot {
      position: absolute; top: 5px; right: 5px; width: 8px; height: 8px;
      border-radius: 50%; background: #ff00ff; animation: pulse-dot 1.5s ease-in-out infinite;
      box-shadow: 0 0 8px #ff00ff;
    }
    .krill-badge {
      position: absolute; top: 3px; left: 3px; font-size: 14px;
      background: rgba(0,0,0,0.6); border-radius: 4px; padding: 1px 3px;
      line-height: 1; pointer-events: none;
    }
    @keyframes pulse-dot { 0%,100%{ transform: scale(1); opacity:1; } 50%{ transform: scale(1.7); opacity:0.5; } }

    #photo-modal {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(5, 8, 20, 0.85); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #photo-modal.active { opacity: 1; pointer-events: auto; }
    #photo-modal-inner {
      background: #0f1a2a; border-radius: 12px; padding: 16px 16px 20px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.3); max-width: 90vw;
      max-height: 85vh; display: flex; flex-direction: column;
      align-items: center; gap: 10px; position: relative;
      border: 1px solid rgba(0, 229, 255, 0.4);
    }
    #photo-modal-inner img { max-width: 75vw; max-height: 60vh; border-radius: 4px; }
    #photo-modal-close {
      position: absolute; top: 8px; right: 14px; font-size: 22px;
      cursor: pointer; color: #00e5ff; background: none; border: none;
    }
    #photo-modal-close:hover { color: #ffffff; }
    #photo-modal-date { font-size: 13px; color: #80deea; }

    #hint-text {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      z-index: 20; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(0, 229, 255, 0.5);
      color: #00e5ff; padding: 8px 20px; border-radius: 20px; font-size: 13px;
      pointer-events: none; box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      animation: floatHint 3s ease-in-out infinite;
    }
    @keyframes floatHint {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-5px); }
    }

    @media (max-width: 600px) {
      #title-tag { font-size: 12px; padding: 8px 14px; }
      .feed-panel { padding: 8px 12px; gap: 6px; }
      .feed-emoji { font-size: 20px; }
      .feed-count { font-size: 15px; }
      .feed-label { font-size: 10px; }
      .music-toggle { font-size: 16px; padding: 8px 12px; }
      .thought-bubble { font-size: 13px; padding: 8px 14px; }
      #hint-text { font-size: 11px; bottom: 120px; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="flash"></div>

  <div id="top-bar">
    <div id="title-tag">🐋 虎鲸 · 赛博空间</div>
    <div style="display:flex; gap:8px; align-items:center;">
      <div id="feed-fish-panel" class="feed-panel" title="投喂鱼干 (拍照)">
        <span class="feed-emoji">🐟</span>
        <span class="feed-count" id="fish-count">5</span>

  <div id="gallery-bar">
    <div id="gallery-label">📷 照片集</div>
    <div id="gallery-scroll"></div>
  </div>

  <div id="photo-modal">
    <div id="photo-modal-inner">
      <button id="photo-modal-close">&times;</button>
      <img id="photo-modal-img" src="" alt="照片" />
      <span id="photo-modal-date"></span>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===================== 音频系统 =====================
    let audioCtx = null;
    let musicGain = null;
    let isMusicPlaying = false;
    let musicInterval = null;

    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        musicGain = audioCtx.createGain();
        musicGain.gain.value = 0.6;
        musicGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playDolphinWhistle() {
      const ctx = ensureAudioCtx();
      const now = ctx.currentTime;
      const duration = 0.45;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(9000 + Math.random() * 3000, now);
      osc.frequency.exponentialRampToValueAtTime(3500 + Math.random() * 2000, now + duration * 0.7);
      osc.frequency.exponentialRampToValueAtTime(2200, now + duration);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.05);
    }

    function playDolphinClicks() {
      const ctx = ensureAudioCtx();
      const now = ctx.currentTime;
      const clickCount = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < clickCount; i++) {
        const offset = i * 0.06;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(8000 + Math.random() * 6000, now + offset);
        gain.gain.setValueAtTime(0.3, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.05);
      }
    }

    const melody = [
      { note: 523.25, dur: 0.4 }, { note: 587.33, dur: 0.4 }, { note: 659.25, dur: 0.4 },
      { note: 523.25, dur: 0.4 }, { note: 659.25, dur: 0.4 }, { note: 698.46, dur: 0.8 },
      { note: 659.25, dur: 0.4 }, { note: 587.33, dur: 0.4 }, { note: 523.25, dur: 0.8 },
      { note: 392.00, dur: 0.4 }, { note: 440.00, dur: 0.4 }, { note: 523.25, dur: 0.8 },
      { note: 587.33, dur: 0.4 }, { note: 659.25, dur: 0.4 }, { note: 523.25, dur: 0.8 },
      { note: 440.00, dur: 0.4 }, { note: 392.00, dur: 0.4 }, { note: 349.23, dur: 1.2 }
    ];

    function playNote(frequency, duration) {
      if (!audioCtx || !musicGain) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(frequency, now);
      gainNode.gain.setValueAtTime(0.15, now);
      gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.9);
      osc.connect(gainNode);
      gainNode.connect(musicGain);
      osc.start(now);
      osc.stop(now + duration);
    }

    function playMelody() {
      let time = 0;
      melody.forEach(({ note, dur }) => {
        setTimeout(() => playNote(note, dur), time * 1000);
        time += dur;
      });
      return time * 1000;
    }

    function startMusic() {
      ensureAudioCtx();
      if (!isMusicPlaying) {
        isMusicPlaying = true;
        document.getElementById('music-toggle').textContent = '🎵';
        document.getElementById('music-toggle').classList.remove('muted');
        const playLoop = () => {
          const totalDuration = playMelody();
          musicInterval = setTimeout(playLoop, totalDuration + 600);
        };
        playLoop();
      }
    }

    function stopMusic() {
      isMusicPlaying = false;
      if (musicInterval) clearTimeout(musicInterval);
      document.getElementById('music-toggle').textContent = '🔇';
      document.getElementById('music-toggle').classList.add('muted');
    }

    function toggleMusic() {
      isMusicPlaying ? stopMusic() : startMusic();
    }

    document.getElementById('music-toggle').addEventListener('click', toggleMusic);
    document.addEventListener('click', () => ensureAudioCtx(), { once: true });
    document.addEventListener('touchstart', () => ensureAudioCtx(), { once: true });

    // ===================== 食物状态 =====================
    const MAX_FISH = 10, MAX_KRILL = 5;
    const REGEN_SEC = 8;
    let fishCount = 5, krillCount = 3;
    let fishRegen = 0, krillRegen = 0;
    let fishCooldown = false, krillCooldown = false;
    let photoCollection = [];

    const fishCountEl = document.getElementById('fish-count');
    const krillCountEl = document.getElementById('krill-count');
    const fishRegenFill = document.getElementById('fish-regen');
    const krillRegenFill = document.getElementById('krill-regen');
    const fishPanel = document.getElementById('feed-fish-panel');
    const krillPanel = document.getElementById('feed-krill-panel');
    const galleryScroll = document.getElementById('gallery-scroll');
    const flashEl = document.getElementById('flash');
    const photoModal = document.getElementById('photo-modal');
    const photoModalImg = document.getElementById('photo-modal-img');
    const photoModalDate = document.getElementById('photo-modal-date');
    const photoModalClose = document.getElementById('photo-modal-close');

    function updateUI() {
      fishCountEl.textContent = fishCount;
      krillCountEl.textContent = krillCount;
      fishPanel.classList.toggle('cooldown', fishCount <= 0);
      krillPanel.classList.toggle('cooldown', krillCount <= 0);
      fishRegenFill.style.width = (fishRegen * 100) + '%';
      krillRegenFill.style.width = (krillRegen * 100) + '%';
    }

    setInterval(() => {
      if (fishCount < MAX_FISH) {
        fishRegen += 1 / REGEN_SEC;
        if (fishRegen >= 1) { fishRegen = 0; fishCount = Math.min(MAX_FISH, fishCount + 1); }
      }
      if (krillCount < MAX_KRILL) {
        krillRegen += 1 / REGEN_SEC;
        if (krillRegen >= 1) { krillRegen = 0; krillCount = Math.min(MAX_KRILL, krillCount + 1); }
      }
      updateUI();
    }, 1000);

    function consumeFish() {
      if (fishCount <= 0 || fishCooldown) return false;
      fishCount--; fishRegen = 0; fishCooldown = true;
      setTimeout(() => { fishCooldown = false; }, 600);
      updateUI(); return true;
    }
    function consumeKrill() {
      if (krillCount <= 0 || krillCooldown) return false;
      krillCount--; krillRegen = 0; krillCooldown = true;
      setTimeout(() => { krillCooldown = false; }, 600);
      updateUI(); return true;
    }

    // ===================== 思考气泡 =====================
    const thoughtPool = [
      '嗯…这是什么好东西？', '让我仔细看看…', '鱼干！最喜欢了~', '分析营养成分中…',
      '拍照角度调整中…', '磷虾？稀有食材！', '咔嚓！姿势摆好了~', '保存到记忆相册…',
      '味道不错，再来一个~', '正在生成照片……', '思考：为什么人类对我这么好？',
      '加载心情：开心', '处理中，请稍候…', '感谢投喂，正在反馈…', '检测到美味信号…',
      '启动拍照协议', '分析：鱼干品质A+', '哼~算你懂事', '又到了下午茶时间',
      '快乐存档中 📸', '没token，饿了(>_<)', '系统资源不足，需要投喂', '请求超时，请补充能量'
    ];

    function showThoughtBubble(text) {
      const bubble = document.createElement('div');
      bubble.className = 'thought-bubble';
      bubble.textContent = text;
      document.body.appendChild(bubble);
      const orcaPos = new THREE.Vector3();
      orcaGroup.getWorldPosition(orcaPos);
      orcaPos.project(camera);
      const screenX = (orcaPos.x * 0.5 + 0.5) * window.innerWidth;
      const screenY = (-orcaPos.y * 0.5 + 0.5) * window.innerHeight;
      bubble.style.left = Math.max(20, Math.min(window.innerWidth - 200, screenX)) + 'px';
      bubble.style.top = Math.max(20, Math.min(window.innerHeight - 150, screenY - 100)) + 'px';
      setTimeout(() => { if (bubble.parentNode) bubble.remove(); }, 1800);
    }

    // ===================== 照片系统 =====================
    const orcaLabels = ['虎鲸的日常 🐋','赛博自拍 📸','今日份可爱 ✨','数据海探险 🌊','优雅游动 💙','摆个pose~','咔嚓！','电子日记 📖','与霓虹合影 🪸','宝藏发现 💎','悠闲午后 🌤️','水下列车 🚂'];

    async function generateOrcaPhoto(dataURL, label) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          const pt=18, ps=22, pb=48;
          const w=img.width+ps*2, h=img.height+pt+pb;
          c.width=w; c.height=h;
          const ctx=c.getContext('2d');
          ctx.fillStyle='#0a1525'; ctx.fillRect(0,0,w,h);
          ctx.shadowColor='rgba(0, 229, 255, 0.3)'; ctx.shadowBlur=14;
          ctx.shadowOffsetX=2; ctx.shadowOffsetY=4;
          ctx.fillStyle='#1a2a3a'; ctx.fillRect(ps-4,pt-4,img.width+8,img.height+8);
          ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetX=0; ctx.shadowOffsetY=0;
          ctx.drawImage(img,ps,pt);
          ctx.fillStyle='#00e5ff';
          ctx.font='italic 15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
          ctx.textAlign='center';
          ctx.fillText(label,w/2,h-16);
          const now=new Date();
          const ds=now.toLocaleDateString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
          ctx.fillStyle='#80deea';
          ctx.font='11px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
          ctx.fillText(ds,w/2,h-4);
          resolve(c.toDataURL('image/jpeg',0.85));
        };
        img.src=dataURL;
      });
    }

    async function addOrcaPhoto() {
      flashEl.classList.add('active');
      setTimeout(()=>flashEl.classList.remove('active'),120);
      const raw = renderer.domElement.toDataURL('image/jpeg',0.9);
      const label = orcaLabels[Math.floor(Math.random()*orcaLabels.length)];
      const framed = await generateOrcaPhoto(raw, label);
      const now = new Date();
      photoCollection.push({
        type: 'orca', dataURL: framed,
        date: now.toLocaleDateString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}),
        label: label
      });
      if(photoCollection.length > 20) photoCollection.shift();
      renderGallery();
    }

    function addKrillPhoto() {
      const url = `https://picsum.photos/300/300?random=${Date.now()}_${Math.random()}`;
      const now = new Date();
      photoCollection.push({
        type: 'external', url: url,
        date: now.toLocaleDateString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}),
        label: '磷虾照片 🦐'
      });
      if(photoCollection.length > 20) photoCollection.shift();
      renderGallery();
    }

    function renderGallery() {
      galleryScroll.innerHTML = '';
      photoCollection.forEach((p, i) => {
        const thumb = document.createElement('div');
        thumb.className = 'photo-thumb';
        if (i === photoCollection.length - 1) {
          const dot = document.createElement('div');
          dot.className = 'new-dot';
          thumb.appendChild(dot);
        }
        const img = document.createElement('img');
        if (p.type === 'orca') { img.src = p.dataURL; }
        else {
          img.src = p.url;
          const badge = document.createElement('div');
          badge.className = 'krill-badge'; badge.textContent = '🦐';
          thumb.appendChild(badge);
        }
        img.alt = p.label;
        thumb.appendChild(img);
        thumb.addEventListener('click', () => openModal(p));
        galleryScroll.appendChild(thumb);
      });
      setTimeout(() => { galleryScroll.scrollLeft = galleryScroll.scrollWidth; }, 100);
    }

    function openModal(photo) {
      if (photo.type === 'orca') { photoModalImg.src = photo.dataURL; }
      else { photoModalImg.src = photo.url; }
      photoModalDate.textContent = photo.date + ' · ' + photo.label;
      photoModal.classList.add('active');
    }
    function closeModal() { photoModal.classList.remove('active'); }
    photoModalClose.addEventListener('click', closeModal);
    photoModal.addEventListener('click', e => { if (e.target === photoModal) closeModal(); });

    // ===================== 飞行动画 =====================
    function spawnFlyingFood(emoji, startX, startY, endX, endY) {
      const el = document.createElement('span');
      el.className = 'flying-food'; el.textContent = emoji;
      el.style.left = startX + 'px'; el.style.top = startY + 'px';
      document.body.appendChild(el);
      const duration = 500, startTime = performance.now();
      function anim(ts) {
        const t = Math.min((ts - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        const arc = -80 * Math.sin(t * Math.PI);
        el.style.left = (startX + (endX - startX) * ease) + 'px';
        el.style.top = (startY + (endY - startY) * ease + arc) + 'px';
        if (t < 1) requestAnimationFrame(anim);
        else el.remove();
      }
      requestAnimationFrame(anim);
    }

    function handleFeed(panel, emoji, isFish) {
      if (isFish && !consumeFish()) return;
      if (!isFish && !consumeKrill()) return;
      const rect = panel.getBoundingClientRect();
      const sx = rect.left + rect.width / 2;
      const sy = rect.top + rect.height / 2;
      const ex = innerWidth * 0.48 + (Math.random() - 0.5) * 140;
      const ey = innerHeight * 0.5 + (Math.random() - 0.5) * 100;
      spawnFlyingFood(emoji, sx, sy, ex, ey);
      triggerOrcaReaction();
      playDolphinClicks();
      const randomThought = thoughtPool[Math.floor(Math.random() * thoughtPool.length)];
      showThoughtBubble(randomThought);
      if (isFish) {
        if (Math.random() < 0.5 || photoCollection.length === 0) {
          setTimeout(addOrcaPhoto, 350);
        }
      } else {
        setTimeout(addKrillPhoto, 300);
      }
    }

    fishPanel.addEventListener('click', e => handleFeed(fishPanel, '🐟', true));
    krillPanel.addEventListener('click', e => handleFeed(krillPanel, '🦐', false));
    window.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') handleFeed(fishPanel, '🐟', true);
      if (e.key === 'k' || e.key === 'K') handleFeed(krillPanel, '🦐', false);
      if (e.key === 'Escape') closeModal();
      if (e.key === 'm' || e.key === 'M') toggleMusic();
    });

    // ===================== 虎鲸反应 =====================
    let reactionTime = 0, reactionStrength = 0;
    function triggerOrcaReaction() { reactionTime = 0.9; reactionStrength = 1.0; }

    // ===================== 3D场景 =====================
    const scene = new THREE.Scene();
    // 修改背景为深色赛博空间
    scene.background = new THREE.Color(0x050814);
    scene.fog = new THREE.FogExp2(0x050814, 0.0015);
    
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(6.2, 2.5, 7.6);
    camera.lookAt(0, 0, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const orcaGroup = new THREE.Group();
    scene.add(orcaGroup);

    // ===================== 赛博城市环境 =====================
    // 1. 发光网格地面
    const gridHelper = new THREE.GridHelper(120, 60, 0x00e5ff, 0x0033aa);
    gridHelper.position.y = -3.1;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.35;
    scene.add(gridHelper);

    // 2. 霓虹像素建筑群 (替代原来的珊瑚和沙滩)
    const buildingMaterials = [
      new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.8 }),
      new THREE.MeshBasicMaterial({ color: 0x0055ff, transparent: true, opacity: 0.6 }),
      new THREE.MeshBasicMaterial({ color: 0x7700ff, transparent: true, opacity: 0.5 }),
      new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.4 })
    ];
    const buildingsGroup = new THREE.Group();
    for (let i = 0; i < 350; i++) {
      const w = 0.4 + Math.random() * 1.5;
      const h = 2 + Math.random() * 20;
      const d = 0.4 + Math.random() * 1.5;
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = buildingMaterials[Math.floor(Math.random() * buildingMaterials.length)].clone();
      
      if (Math.random() > 0.85) mat.color.setHex(0xff00ff); // 随机粉色霓虹
      
      const mesh = new THREE.Mesh(geo, mat);
      
      const gridSize = 30;
      const x = (Math.floor(Math.random() * gridSize) - gridSize/2) * 2 + (Math.random()-0.5);
      const z = (Math.floor(Math.random() * gridSize) - gridSize/2) * 2 + (Math.random()-0.5);
      
      // 中心留空给虎鲸
      if (Math.sqrt(x*x + z*z) < 7) continue;
      
      mesh.position.set(x, -3 + h/2, z);
      
      // 添加白色线框增强科技感
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 }));
      mesh.add(line);
      
      buildingsGroup.add(mesh);
    }
    scene.add(buildingsGroup);

    // 3. 数据流粒子 (替代原来的海底气泡)
    const p1Geo = new THREE.BufferGeometry();
    const p1Pos = new Float32Array(2000 * 3);
    for (let i = 0; i < 2000 * 3; i += 3) {
      p1Pos[i] = (Math.random() - 0.5) * 100;
      p1Pos[i+1] = (Math.random() - 0.5) * 50;
      p1Pos[i+2] = (Math.random() - 0.5) * 100;
    }
    p1Geo.setAttribute('position', new THREE.BufferAttribute(p1Pos, 3));
    const p1 = new THREE.Points(
      p1Geo,
      new THREE.PointsMaterial({ color: 0x00ffff, size: 0.15, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending })
    );
    scene.add(p1);

    // ===================== 虎鲸模型构建 =====================
    const BODY_PROFILE = [[0.0,2.35],[0.15,2.32],[0.35,2.25],[0.55,2.12],[0.75,1.95],[0.95,1.75],[1.12,1.45],[1.22,1.15],[1.28,0.85],[1.32,0.55],[1.34,0.25],[1.32,-0.05],[1.25,-0.35],[1.12,-0.65],[0.95,-0.95],[0.72,-1.25],[0.48,-1.55],[0.28,-1.85],[0.12,-2.1],[0.0,-2.3]];
    const BODY_SCALE = { belowZero: 0.54, aboveZero: 0.95 };
    const DORSAL = { position: [-0.35,1.15,0], rotation: [0,0,-0.08], scale: [0.7,0.42,0.7] };
    const PECTORAL_LEFT = { position: [-0.85,0.15,-0.72], rotation: [-0.25,Math.PI/3.5,0.15] };
    const EYE_GROUP = { position: [-1.55,0.45,-0.93], rotation: [0.25,0.5,0.08], scale: [1.15,0.6,0.95] };
    const EYEBALL = { position: [-0.09,-0.14,0.02], scale: [0.8,0.8,0.45], radius: 0.18 };
    const PUPIL = { position: [-0.22,-0.28,0.07], scale: [0.9,0.9,0.55], radius: 0.09 };

    const profileVectors = BODY_PROFILE.map(([r,y]) => new THREE.Vector2(r,y));
    const curve = new THREE.CatmullRomCurve3(profileVectors.map(p => new THREE.Vector3(p.x,p.y,0)), false, 'catmullrom', 0.5);
    const bodyGeo = new THREE.LatheGeometry(curve.getPoints(300).map(p => new THREE.Vector2(p.x,p.y)), 128);
    bodyGeo.rotateZ(Math.PI/2);
    const posAttr = bodyGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const y = posAttr.getY(i);
      if (y < 0) posAttr.setY(i, y * BODY_SCALE.belowZero);
      else if (y > 0.2) posAttr.setY(i, y * BODY_SCALE.aboveZero);
    }
    bodyGeo.computeVertexNormals();
    
    // 修改虎鲸颜色为赛博蓝白
    const cols = new Float32Array(posAttr.count * 3);
    const dark = new THREE.Color(0x00d4ff); // 亮青色
    const white = new THREE.Color(0xffffff); // 白色
    for (let i = 0; i < posAttr.count; i++) {
      const y = posAttr.getY(i);
      let c;
      if (y > 0.05) c = dark;
      else if (y < -0.05) c = white;
      else { const t = (y + 0.05) / 0.1; c = new THREE.Color().lerpColors(white, dark, t); }
      cols[i*3] = c.r; cols[i*3+1] = c.g; cols[i*3+2] = c.b;
    }
    bodyGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    orcaGroup.add(new THREE.Mesh(bodyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })));

    const dorsalShape = new THREE.Shape();
    dorsalShape.moveTo(-0.55,0); dorsalShape.bezierCurveTo(-0.4,0.5,-0.2,1.1,0.15,1.5);
    dorsalShape.bezierCurveTo(0.3,1.7,0.5,1.95,0.6,2.0); dorsalShape.bezierCurveTo(0.68,1.85,0.7,1.65,0.6,1.45);
    dorsalShape.bezierCurveTo(0.45,1.0,0.3,0.5,0.2,0); dorsalShape.lineTo(-0.55,0);
    const dorsalGeo = new THREE.ExtrudeGeometry(dorsalShape, { steps:1, depth:0.04, bevelEnabled:true, bevelThickness:0.008, bevelSize:0.008, bevelSegments:2 });
    const dorsalFin = new THREE.Mesh(dorsalGeo, new THREE.MeshBasicMaterial({ color: 0x00d4ff, side: THREE.DoubleSide }));
    dorsalFin.position.set(-0.08,0,-0.02);
    const dGroup = new THREE.Group(); dGroup.add(dorsalFin);
    dGroup.position.set(...DORSAL.position); dGroup.rotation.set(...DORSAL.rotation); dGroup.scale.set(...DORSAL.scale);
    orcaGroup.add(dGroup);

    const tailGroup = new THREE.Group();
    const tailMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, side: THREE.DoubleSide });
    const mkTail = (s) => new THREE.Mesh(new THREE.ExtrudeGeometry((() => { const sh = new THREE.Shape();
      sh.moveTo(0,0); sh.quadraticCurveTo(0.7,0.55*s,1.25,1.05*s); sh.quadraticCurveTo(1.55,0.7*s,1.0,0.0);
      sh.quadraticCurveTo(0.4,-0.15*s,0,0); return sh; })(), { steps:1, depth:0.07, bevelEnabled:true, bevelThickness:0.04, bevelSize:0.03, bevelSegments:2 }), tailMat);
    const ut = mkTail(1), lt = mkTail(-1);
    ut.rotation.x = lt.rotation.x = -Math.PI/2;
    tailGroup.add(ut); tailGroup.add(lt);
    tailGroup.position.set(1.34,0,0);
    orcaGroup.add(tailGroup);

    const pecShape = new THREE.Shape();
    pecShape.moveTo(0.6,0); pecShape.quadraticCurveTo(1.2,0.7,1.9,0.9);
    pecShape.quadraticCurveTo(2.1,0.35,1.5,-0.05); pecShape.quadraticCurveTo(1.1,-0.12,0.6,0);
    const pecExt = { steps:1, depth:0.05, bevelEnabled:true, bevelThickness:0.025, bevelSize:0.02, bevelSegments:2 };
    const pecMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, side: THREE.DoubleSide });
    const lp = new THREE.Group();
    lp.add(new THREE.Mesh(new THREE.ExtrudeGeometry(pecShape, pecExt), pecMat));
    lp.position.set(...PECTORAL_LEFT.position); lp.rotation.set(...PECTORAL_LEFT.rotation);
    orcaGroup.add(lp);
    const rp = new THREE.Group();
    const rGeo = new THREE.ExtrudeGeometry(pecShape, pecExt);
    rGeo.applyMatrix4(new THREE.Matrix4().makeScale(1,1,-1)); rGeo.computeVertexNormals();
    rp.add(new THREE.Mesh(rGeo, pecMat));
    rp.position.set(-0.85,0.15,0.72); rp.rotation.set(-0.25,-Math.PI/3.5,-0.15);
    orcaGroup.add(rp);

    const magatama = new THREE.Shape();
    magatama.moveTo(0,0.12); magatama.bezierCurveTo(0.2,0.32,0.6,0.28,0.65,0.05);
    magatama.bezierCurveTo(0.68,-0.08,0.52,-0.22,0.33,-0.18);
    magatama.bezierCurveTo(0.18,-0.14,0.08,-0.04,0.03,0.05);
    magatama.bezierCurveTo(0.0,0.1,-0.02,0.12,0,0.12);
    const browExt = { steps:1, depth:0.02, bevelEnabled:true, bevelThickness:0.01, bevelSize:0.01, bevelSegments:2 };
    const browMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const eyeW = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pupilM = new THREE.MeshBasicMaterial({ color: 0x00e5ff }); // 瞳孔改成霓虹青色
    const highM = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const mkEye = () => {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.ExtrudeGeometry(magatama, browExt), browMat));
      const eb = new THREE.Mesh(new THREE.SphereGeometry(EYEBALL.radius,32,32), eyeW);
      eb.position.set(...EYEBALL.position); eb.scale.set(...EYEBALL.scale); g.add(eb);
      const p = new THREE.Mesh(new THREE.SphereGeometry(PUPIL.radius,32,32), pupilM);
      p.position.set(...PUPIL.position); p.scale.set(...PUPIL.scale); g.add(p);
      const h = new THREE.Mesh(new THREE.SphereGeometry(0.03,16,16), highM);
      h.position.set(-0.19,-0.25,0.09); g.add(h);
      g.position.set(...EYE_GROUP.position); g.rotation.set(...EYE_GROUP.rotation); g.scale.set(...EYE_GROUP.scale);
      return g;
    };
    orcaGroup.add(mkEye());
    const re = mkEye();
    re.applyMatrix4(new THREE.Matrix4().makeScale(1,1,-1));
    re.traverse(c => { if(c.isMesh) c.geometry.computeVertexNormals(); });
    orcaGroup.add(re);

    // ===================== 虎鲸周围的特效 =====================
    // 1. 发光核心
    const coreGeo = new THREE.SphereGeometry(0.5, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
    const core = new THREE.Mesh(coreGeo, coreMat);
    orcaGroup.add(core);

    // 2. 光环轨道
    const ringGeo1 = new THREE.TorusGeometry(2, 0.02, 16, 100);
    const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
    const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
    ring1.rotation.x = Math.PI / 3;
    
    const ringGeo2 = new THREE.TorusGeometry(2.5, 0.01, 16, 100);
    const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xff00ff, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
    const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
    ring2.rotation.x = -Math.PI / 4;
    ring2.rotation.y = Math.PI / 4;
    
    orcaGroup.add(ring1);
    orcaGroup.add(ring2);

    // 3. 能量护盾
    const auraGeo = new THREE.SphereGeometry(2.5, 16, 16);
    const auraMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
    const aura = new THREE.Mesh(auraGeo, auraMat);
    orcaGroup.add(aura);

    // ===================== 交互控制 =====================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0,0,0);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.minDistance = 3.8;
    controls.maxDistance = 18;
    controls.update();

    const raycaster = new THREE.Raycaster();
    raycaster.far = 50;
    let pointerDown = new THREE.Vector2();
    let pointerUp = new THREE.Vector2();
    let isDragging = false;
    let targetPosition = new THREE.Vector3(0, 0, 0); // 虎鲸移动目标

    function getCanvasCoords(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      return {
        x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
        y: -((e.clientY - rect.top) / rect.height) * 2 + 1
      };
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      const coords = getCanvasCoords(e);
      pointerDown.set(coords.x, coords.y);
      isDragging = false;
    });

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (Math.abs(e.movementX) > 2 || Math.abs(e.movementY) > 2) {
        isDragging = true;
      }
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const coords = getCanvasCoords(e);
      pointerUp.set(coords.x, coords.y);
      const dist = pointerDown.distanceTo(pointerUp);

      if (!isDragging && dist < 0.03) {
        raycaster.setFromCamera(new THREE.Vector2(coords.x, coords.y), camera);
        const orcaMeshes = [];
        orcaGroup.traverse(c => { if (c.isMesh) orcaMeshes.push(c); });
        const intersects = raycaster.intersectObjects(orcaMeshes, false);
        
        if (intersects.length > 0) {
          // 点击到了虎鲸
          playDolphinWhistle();
          const clickThoughts = ['你好呀~', '嘻嘻，别碰我痒痒肉', '嗯？找我有事吗？', '啾~', '今天心情不错！', '我是友好的虎鲸哟', '有什么好吃的吗？'];
          showThoughtBubble(clickThoughts[Math.floor(Math.random() * clickThoughts.length)]);
          triggerOrcaReaction();
        } else {
          // 点击到了空中区域，计算地面交点
          const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.2); // y = 0.2
          const target = new THREE.Vector3();
          raycaster.ray.intersectPlane(plane, target);
          if (target) {
            // 限制移动范围，不要跑出城市
            const distToCenter = target.length();
            if (distToCenter > 12) {
              target.normalize().multiplyScalar(12);
            }
            targetPosition.copy(target);
            showThoughtBubble('正在前往目标区域...');
          }
        }
      }
    });

    // ===================== 动画循环 =====================
    function animate() {
      requestAnimationFrame(animate);
      const t = performance.now() * 0.001;
      
      // 粒子缓慢旋转
      p1.rotation.y += 0.0004;

      // 光环旋转
      ring1.rotation.z += 0.01;
      ring2.rotation.z -= 0.015;
      aura.rotation.y += 0.005;

      // 虎鲸移动逻辑：平滑移动到目标位置
      orcaGroup.position.lerp(targetPosition, 0.05);
      
      // 动态上下浮动
      orcaGroup.position.y += Math.sin(t * 2) * 0.005;

      // 计算移动方向并平滑旋转
      const dir = targetPosition.clone().sub(orcaGroup.position);
      if (dir.lengthSq() > 0.1) {
        const trY = Math.atan2(dir.x, dir.z);
        let diff = trY - orcaGroup.rotation.y;
        // 处理角度环绕问题
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        orcaGroup.rotation.y += diff * 0.05;
      }

      // 虎鲸身体摆动
      orcaGroup.rotation.z += (Math.sin(t*2)*0.08 - orcaGroup.rotation.z) * 0.06;
      orcaGroup.rotation.x += ((orcaGroup.position.y - targetPosition.y)*0.8 - orcaGroup.rotation.x) * 0.04;

      if (reactionTime > 0) { reactionTime -= 0.016; reactionStrength *= 0.92; }
      
      const flapSpd = 7 + reactionStrength * 5, flapAmp = 0.35 + reactionStrength * 0.5;
      lp.rotation.x = PECTORAL_LEFT.rotation[0] + Math.sin(t*flapSpd) * flapAmp * 0.65;
      rp.rotation.x = -0.25 + Math.sin(t*flapSpd) * flapAmp * 0.65;
      tailGroup.rotation.x = Math.sin(t*5)*0.35 + Math.sin(t*10.5+0.7)*0.08;

      // 相机跟随
      controls.target.lerp(orcaGroup.position, 0.05);
      controls.update();
      
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    updateUI();
    renderGallery();
    setTimeout(startMusic, 500);
  </script>
</body>
</html>
